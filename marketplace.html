<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroCare – Marketplace</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">🌱 AgroCare</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="diagnosis.html">Diagnosis</a></li>
            <li><a href="marketplace.html" class="active">Marketplace</a></li>
            <li><a href="index.html#about">About</a></li>
        </ul>
        <div class="cart-icon">🛒 <span id="cartCount">0</span></div>
    </nav>

    <!-- Marketplace -->
    <section class="marketplace">
        <h1>🛒 Smart Agricultural Marketplace</h1>
        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="Search products..." />
            <select id="categoryFilter">
                <option value="all">All Categories</option>
                <option value="seeds">Seeds</option>
                <option value="fertilizers">Fertilizers</option>
                <option value="tools">Tools</option>
            </select>
        </div>

        <div class="product-grid" id="productGrid">
            <!-- Products will be inserted by JavaScript -->
        </div>
    </section>

    <!-- Cart Sidebar -->
    <div id="cartSidebar" style="display:none;">
        <h2>Your Cart</h2>
        <ul id="cartItems"></ul>
        <button id="checkoutBtn" class="btn primary">Checkout</button>
    </div>

    <footer>
        <p>©️ 2026 AgroCare. Made with ❤️ by Ayush Singh</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
